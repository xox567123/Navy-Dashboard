<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navy SEAL Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #0b0e11; /* tactical dark */
        color: #e6e6e6;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .seal-emblem {
        width: 180px;
        margin-top: 40px;
        opacity: 0.95;
    }

    h1 {
        margin-top: 10px;
        font-size: 36px;
        letter-spacing: 2px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .grid {
        margin-top: 40px;
        display: grid;
        grid-template-columns: repeat(3, 160px);
        gap: 30px;
    }

    .tile {
        background: #11161d;
        border: 2px solid #1f2a35;
        border-radius: 14px;
        padding: 25px;
        text-align: center;
        cursor: pointer;
        transition: 0.2s;
    }

    .tile:hover {
        background: #18212b;
        transform: scale(1.03);
    }

    .tile-icon {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .tile-label {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    /* Notepad */
    #notepad {
        margin-top: 40px;
        width: 80%;
        max-width: 700px;
        height: 350px;
        display: none;
        background: #ffffff;
        color: #000;
        padding: 20px;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        resize: none;
    }
</style>
</head>
<body>

<!-- Navy SEAL Emblem -->
<img class="seal-emblem" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/United_States_Navy_SEALs_insignia.svg/1200px-United_States_Navy_SEALs_insignia.svg.png">

<h1>Navy SEAL Dashboard</h1>

<div class="grid">

    <div class="tile" id="addNoteTile">
        <div class="tile-icon">➕</div>
        <div class="tile-label">Add Note</div>
    </div>

    <div class="tile">
        <div class="tile-icon">📡</div>
        <div class="tile-label">Comms</div>
    </div>

    <div class="tile">
        <div class="tile-icon">📅</div>
        <div class="tile-label">Schedule</div>
    </div>

    <div class="tile">
        <div class="tile-icon">🛰️</div>
        <div class="tile-label">Intel</div>
    </div>

    <div class="tile">
        <div class="tile-icon">⚙️</div>
        <div class="tile-label">Systems</div>
    </div>

    <div class="tile">
        <div class="tile-icon">🎯</div>
        <div class="tile-label">Ops</div>
    </div>

</div>

<textarea id="notepad" placeholder="Type mission notes..."></textarea>

<script>
    const addNoteTile = document.getElementById("addNoteTile");
    const notepad = document.getElementById("notepad");

    addNoteTile.addEventListener("click", () => {
        notepad.style.display = "block";
        addNoteTile.style.display = "none";
    });
</script>

</body>
</html>
