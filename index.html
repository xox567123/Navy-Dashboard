<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navy SEAL Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #0b0e11;
        color: white;
        text-align: center;
        height: 100vh;
        background-image: url('https://upload.wikimedia.org/wikipedia/commons/5/5d/United_States_Navy_SEALs_insignia.svg');
        background-size: 500px;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
        opacity: 0.95;
    }

    h1 {
        margin-top: 30px;
        font-size: 36px;
        letter-spacing: 2px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .tile-container {
        margin-top: 60px;
        display: flex;
        justify-content: center;
    }

    .tile {
        width: 140px;
        height: 140px;
        background: rgba(20, 25, 35, 0.85);
        border: 2px solid #1f2a35;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
        cursor: pointer;
        transition: 0.2s;
    }

    .tile:hover {
        background: rgba(30, 40, 55, 0.9);
        transform: scale(1.05);
    }

    .tile-label {
        margin-top: 12px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    #notepad {
        margin: 40px auto;
        width: 80%;
        max-width: 700px;
        height: 350px;
        display: none;
        background: #ffffff;
        color: #000;
        padding: 20px;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        resize: none;
    }
</style>
</head>
<body>

<h1>Navy SEAL Dashboard</h1>

<div class="tile-container">
    <div class="tile" id="addNoteTile">+</div>
</div>
<div class="tile-label">Add Note</div>

<textarea id="notepad" placeholder="Type mission notes..."></textarea>

<script>
    const addNoteTile = document.getElementById("addNoteTile");
    const notepad = document.getElementById("notepad");

    addNoteTile.addEventListener("click", () => {
        notepad.style.display = "block";
        addNoteTile.style.display = "none";
        document.querySelector(".tile-label").style.display = "none";
    });
</script>

</body>
</html>
