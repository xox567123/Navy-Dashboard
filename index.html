<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navy SEAL Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #0b0e11;
        color: white;
        text-align: center;
        background-image: url('https://upload.wikimedia.org/wikipedia/commons/5/5d/United_States_Navy_SEALs_insignia.svg');
        background-size: 600px;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: fixed;
    }

    h1 {
        margin-top: 30px;
        font-size: 36px;
        letter-spacing: 2px;
        font-weight: 700;
        text-transform: uppercase;
    }

    .grid {
        margin-top: 60px;
        display: grid;
        grid-template-columns: repeat(4, 150px);
        gap: 40px;
        justify-content: center;
    }

    .tile {
        width: 150px;
        height: 150px;
        background: rgba(20, 25, 35, 0.85);
        border: 2px solid #1f2a35;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 60px;
        cursor: pointer;
        transition: 0.2s;
    }

    .tile:hover {
        background: rgba(30, 40, 55, 0.9);
        transform: scale(1.05);
    }

    .tile-label {
        margin-top: 12px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    /* Pages */
    .page {
        display: none;
        margin-top: 40px;
    }

    #notepad {
        width: 80%;
        max-width: 700px;
        height: 350px;
        background: #ffffff;
        color: #000;
        padding: 20px;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
        resize: none;
    }

    .backBtn {
        margin-top: 20px;
        padding: 12px 25px;
        background: #1a2f55;
        border: none;
        color: white;
        font-size: 18px;
        border-radius: 10px;
        cursor: pointer;
    }

    .backBtn:hover {
        background: #24426f;
    }

    video {
        width: 80%;
        max-width: 700px;
        border-radius: 10px;
        margin-top: 20px;
    }
</style>
</head>
<body>

<h1>Navy SEAL Dashboard</h1>

<!-- MAIN GRID -->
<div id="mainGrid" class="grid">

    <div>
        <div class="tile" onclick="openPage('notesPage')">+</div>
        <div class="tile-label">Add Note</div>
    </div>

    <div>
        <div class="tile" onclick="openPage('cameraPage')">+</div>
        <div class="tile-label">Cameras</div>
    </div>

    <div>
        <div class="tile" onclick="openPage('opsPage')">+</div>
        <div class="tile-label">Operations</div>
    </div>

    <div>
        <div class="tile" onclick="openPage('intelPage')">+</div>
        <div class="tile-label">Intel</div>
    </div>

</div>

<!-- NOTES PAGE -->
<div id="notesPage" class="page">
    <h2>Mission Notes</h2>
    <textarea id="notepad" placeholder="Type mission notes..."></textarea>
    <br>
    <button class="backBtn" onclick="goBack()">Back</button>
</div>

<!-- CAMERA PAGE -->
<div id="cameraPage" class="page">
    <h2>Camera Feed</h2>

    <video id="camVid" controls autoplay>
        <source id="camSource" src="" type="video/mp4">
    </video>

    <br>
    <button class="backBtn" onclick="goBack()">Back</button>
</div>

<!-- OPS PAGE -->
<div id="opsPage" class="page">
    <h2>Operations</h2>
    <p>Placeholder page — you can tell me what you want here.</p>
    <button class="backBtn" onclick="goBack()">Back</button>
</div>

<!-- INTEL PAGE -->
<div id="intelPage" class="page">
    <h2>Intel</h2>
    <p>Placeholder page — add whatever intel features you want.</p>
    <button class="backBtn" onclick="goBack()">Back</button>
</div>

<script>
    function openPage(pageId) {
        document.getElementById("mainGrid").style.display = "none";
        document.getElementById(pageId).style.display = "block";

        if (pageId === "cameraPage") {
            playRandomCamera();
        }
    }

    function goBack() {
        document.querySelectorAll('.page').forEach(p => p.style.display = "none");
        document.getElementById("mainGrid").style.display = "grid";
    }

    function playRandomCamera() {
        const clips = [
            "https://cdn.discordapp.com/attachments/123/robloxprison1.mp4",
            "https://cdn.discordapp.com/attachments/123/robloxprison2.mp4",
            "https://cdn.discordapp.com/attachments/123/robloxprison3.mp4"
        ];

        const randomClip = clips[Math.floor(Math.random() * clips.length)];
        document.getElementById("camSource").src = randomClip;
        document.getElementById("camVid").load();
        document.getElementById("camVid").play();
    }
</script>

</body>
</html>
